<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 상담 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>학생 상담 시스템</h1>
        <p>컴퓨터공학과 학생 상담</p>
    </header>

    <main>
        <form id="counselingForm" class="content-section">
            <div class="form-group">
                <label for="student_id">학번:</label>
                <input type="text" id="student_id" name="student_id" required>
            </div>

            <div class="form-group">
                <label for="name">이름:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="department">학과:</label>
                <input type="text" id="department" name="department" value="컴퓨터공학과" readonly>
            </div>

            <div class="form-group">
                <label for="category">상담 분류:</label>
                <select id="category" name="category" required>
                    <option value="">선택하세요</option>
                    <option value="학사관리">학사관리</option>
                    <option value="학교생활">학교생활</option>
                    <option value="진로관리">진로관리</option>
                    <option value="기타">기타</option>
                </select>
            </div>

            <div class="form-group">
                <label for="content">상담 내용:</label>
                <textarea id="content" name="content" rows="5" required></textarea>
            </div>

            <button type="submit">상담 기록 저장</button>
        </form>

        <div id="message" class="message"></div>

        <div class="content-section">
            <h2>상담 기록 조회</h2>
            <div class="form-group">
                <label for="search_student_id">학번으로 검색:</label>
                <input type="text" id="search_student_id" placeholder="학번을 입력하세요">
                <button onclick="searchRecords()">검색</button>
            </div>
            <div id="searchResults"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 컴퓨터공학과 학생 상담 시스템. All rights reserved.</p>
    </footer>

    <script>
        // localStorage에서 데이터 가져오기
        function getRecords() {
            return JSON.parse(localStorage.getItem('counselingRecords')) || [];
        }

        // localStorage에 데이터 저장하기
        function saveRecord(record) {
            const records = getRecords();
            records.push({
                ...record,
                id: Date.now(), // 고유 ID 생성
                timestamp: new Date().toISOString()
            });
            localStorage.setItem('counselingRecords', JSON.stringify(records));
        }

        // 폼 제출 처리
        document.getElementById('counselingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const record = {
                student_id: formData.get('student_id'),
                name: formData.get('name'),
                department: formData.get('department'),
                category: formData.get('category'),
                content: formData.get('content')
            };

            saveRecord(record);
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = '상담 기록이 저장되었습니다.';
            messageDiv.className = 'message success';
            
            this.reset();
        });

        // 상담 기록 검색
        function searchRecords() {
            const searchId = document.getElementById('search_student_id').value;
            const records = getRecords();
            const filteredRecords = records.filter(record => record.student_id === searchId);
            
            const resultsDiv = document.getElementById('searchResults');
            
            if (filteredRecords.length === 0) {
                resultsDiv.innerHTML = '<p class="no-results">검색 결과가 없습니다.</p>';
                return;
            }

            let html = '<div class="records-list">';
            filteredRecords.forEach(record => {
                html += `
                    <div class="record-item">
                        <h3>${record.category} - ${new Date(record.timestamp).toLocaleString()}</h3>
                        <p><strong>이름:</strong> ${record.name}</p>
                        <p><strong>학과:</strong> ${record.department}</p>
                        <p><strong>상담 내용:</strong> ${record.content}</p>
                    </div>
                `;
            });
            html += '</div>';
            
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
